annotation:
  output_root: metadata/local/annotations/field2_area_zones
  maximum_raster_extension_fraction: 0.10
  coverage_modes:
    - entire_support_research_field
    - entire_support_outside_research_field
    - mixed_manual_boundaries
    - uncertain_requires_review
  zone_types:
    - research_crop_area
    - alley
    - outside_research_field
    - uncertain_boundary
  zone_definitions:
    research_crop_area: "investigator-identified planted-row/research-plot domain; not a biological chickpea label."
    alley: "investigator-confirmed plot or tractor alley; only soil and weeds occur by investigator rule."
    outside_research_field: "valid imagery outside the intended experiment; it may contain soil or varied vegetation."
    uncertain_boundary: "geometry that cannot be placed confidently."

operational_geometry:
  output_root: metadata/local/annotations/field2_area_zones/operational_geometry
  source_vertices_immutable: true
  terminal_near_duplicate_distance_pixels: 12.0
  terminal_repair_scope: operational_only
  validity_repair: deterministic_raster_polygonize_all_components
  pixel_domain_precedence_low_to_high:
    - research_crop_area
    - uncertain_boundary
    - alley
    - outside_research_field
  precedence_rule: outside_research_field>alley>uncertain_boundary>research_crop_area>unassigned_valid_support
  overlap_policy: warning_and_deterministic_precedence
  blank_mode_with_polygons: mixed_manual_boundaries
  biological_labels_assigned: false

freeze:
  output_root: metadata/local/contracts/field2_area_zone_freeze
  contract: metadata/local/contracts/field2_area_zone_contract.yaml
  main_membership: field2_area_zone_membership_main.csv
  reserve_membership_locked: field2_area_zone_membership_reserve_locked.csv
  counts: field2_area_zone_counts.csv
  precedence_summary: field2_area_precedence_summary.csv
  mask_manifest: field2_area_domain_mask_manifest.csv
  domain_pixel_totals: field2_area_domain_pixel_totals.csv
  effective_mode_reconciliation: field2_area_effective_mode_reconciliation.csv
  geometry_repair_audit: field2_area_operational_geometry_audit.csv
  operational_geometry: field2_area_operational_geometry.geojson
  mask_root: masks
  raw_membership_mask_root: raw_membership_masks
  expected_reviewed_cubes: 40
  reserve_coordinates_in_outputs: false
  overwrite_prohibited: true

safety:
  localhost_only: true
  source_open_mode: read_only
  gdal_pam_enabled: "NO"
  biological_labels_prohibited: true
  predictions_prohibited: true
  probabilities_prohibited: true
  checkpoints_prohibited: true
  automatic_geometry_inference_prohibited: true
  morphology_prohibited: true
