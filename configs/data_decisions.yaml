  field1_cube30:
    reason: Full SHA-256 duplicate of Cube 32; class counts agree with Cube 32 masks.
    duplicate_of: field1_cube32
  field1_cube56:
    reason: Full SHA-256 duplicate of Cube 35; class counts agree with Cube 35 masks.
    duplicate_of: field1_cube35

