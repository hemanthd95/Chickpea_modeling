    - chickpea_absent_negative_control
    - challenge_only
    - sensitivity_only
    - exclude_with_reason
    - unreviewed
  flags:
    - chickpea_visible
    - chickpea_very_small_or_immature
    - chickpea_absent_confirmed
    - ordinary_weed_visible
    - tall_grass_weed_visible
    - soil_visible
    - mixed_pixels_common
    - annotation_difficult
    - georectification_concern
    - other_visual_concern
