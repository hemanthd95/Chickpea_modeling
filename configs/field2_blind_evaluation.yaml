  preview_max_dimension: 900
  preview_percentiles: [2.0, 98.0]
  false_colour_wavelengths_nm: [800.0, 670.0, 550.0]

freeze:
  role_table: metadata/local/contracts/field2_cube_role_table.csv
  summary_table: metadata/local/reports/field2_cube_role_freeze/field2_cube_role_summary.csv
  frozen_overview: metadata/local/reports/field2_cube_role_freeze/field2_cube_role_frozen_overview.png
  expected_role_totals:
    primary_three_class: 20
    challenge_only: 8
    chickpea_absent_negative_control: 7
    sensitivity_only: 5
    exclude_with_reason: 0
    unreviewed: 0
  expected_flag_totals:
    chickpea_visible: 20
    chickpea_very_small_or_immature: 14
    chickpea_absent_confirmed: 7
    ordinary_weed_visible: 40
    tall_grass_weed_visible: 34
    soil_visible: 40

role_schema:
  primary_roles:
    - primary_three_class
    - chickpea_absent_negative_control
    - challenge_only
    - sensitivity_only
    - exclude_with_reason
    - unreviewed
  flags:
    - chickpea_visible
    - chickpea_very_small_or_immature
    - chickpea_absent_confirmed
    - ordinary_weed_visible
    - tall_grass_weed_visible
    - soil_visible
    - mixed_pixels_common
    - annotation_difficult
    - georectification_concern
    - other_visual_concern
  confidence: [high, medium, low]

sampling:
  seed: 20260817
  spatial_group_size_m: 5.0
  minimum_separation_m: 0.25
  geographic_ground_cell_size_m: 0.10
  annotation_context_radius_preview_pixels: 110
  scalar_index_rank_strata:
    - rank_00_20
    - rank_20_40
    - rank_40_60
    - rank_60_80
    - rank_80_100
  main_points_per_cube_by_role:
    primary_three_class: 20
    chickpea_absent_negative_control: 20
    challenge_only: 25
    sensitivity_only: 12
    exclude_with_reason: 0
  reserve_points_per_cube_by_role:
    primary_three_class: 10
    chickpea_absent_negative_control: 10
    challenge_only: 12
    sensitivity_only: 6
    exclude_with_reason: 0
  allocation_status: predeclared_fixed_after_cube_role_freeze
  output_root: metadata/local/annotations/field2_blind_sampling
  main_frame: metadata/local/annotations/field2_blind_sampling/field2_blind_main_sampling_frame.csv
  reserve_frame: metadata/local/annotations/field2_blind_sampling/field2_blind_reserve_sampling_frame.csv
  combined_frame: metadata/local/annotations/field2_blind_sampling/field2_blind_combined_sampling_frame.csv
  allocation_audit: metadata/local/reports/field2_blind_sampling/field2_blind_allocation_audit.csv
  stratum_block_audit: metadata/local/reports/field2_blind_sampling/field2_blind_stratum_block_audit.csv
  sampling_audit: metadata/local/reports/field2_blind_sampling/field2_blind_sampling_audit.yaml
  sampling_map: metadata/local/reports/field2_blind_sampling/field2_blind_sampling_overview.png
  sampling_contract: metadata/local/contracts/field2_blind_sampling_frame_contract.yaml
  expected_main_total: 800
  expected_reserve_total: 396
  reserve_release_policy: separate_immutable_authorization_required
  reserve_release_gates_after_800_main_reviews:
    confidently_labeled_chickpea_primary_and_challenge_minimum: 75
    confidently_labeled_ordinary_weed_minimum: 100
    confidently_labeled_tall_grass_weed_minimum: 75
    confidently_labeled_soil_minimum: 100
    chickpea_contributing_cubes_minimum: 4
    tall_grass_weed_contributing_cubes_minimum: 4
    primary_class_effective_design_weighted_sample_size_minimum: 50
  reserve_release_requires_separate_immutable_authorization: true
  reserve_release_prohibited_evidence:
    - supervised_predictions
    - observed_model_errors
    - probabilities
    - model_confidence
    - preliminary_accuracy

point_annotation:
  labels:
    - chickpea
    - ordinary_weed
    - tall_grass_weed
    - other_weed
    - soil
    - chickpea_soil_mixed
    - chickpea_weed_mixed
    - weed_soil_mixed
    - uncertain
    - nodata_invalid
  output_root: metadata/local/annotations/field2_blind_points
  port: 8773

annotation_display:
  version: field2_annotation_display_natural_rgb_v1
  default_layer: natural_rgb
  rgb_target_wavelengths_nm:
    red: 670.0
    green: 550.0
    blue: 480.0
  maximum_wavelength_difference_nm: 15.0
  stretch_percentiles: [2.0, 98.0]
  preview_root: metadata/local/reports/field2_annotation_display/natural_rgb
  preview_manifest: metadata/local/reports/field2_annotation_display/field2_natural_rgb_manifest.csv
  display_contract: metadata/local/contracts/field2_annotation_display_addendum.yaml

safety:
  gdal_pam_enabled: "NO"
  localhost_only: true
  source_open_mode: read_only
  no_automatic_biological_roles: true
  prediction_sources_prohibited: true
  probability_sources_prohibited: true
  embeddings_prohibited: true
  field1_labels_prohibited: true
  training_prohibited: true
