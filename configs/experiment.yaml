seed: 42
data:
  manifest: configs/data_manifest.csv
  patch_size: 15
  channels: [pca, deriv1, deriv2, ndvi]
  vegetation_only: true
  cluster_target: weed
  split_group: field_id
  valid_fraction: 0.2
model:
  method: simclr
  encoder: resnet18
  embedding_dim: 128
  projection_dim: 128
training:
  epochs: 100
  batch_size: 256
  learning_rate: 0.0003
  weight_decay: 0.0001
  num_workers: 8
  mixed_precision: true
clustering:
  candidates: [2, 3, 4, 5, 6, 7, 8]
  seeds: [11, 23, 42, 71, 101]
  algorithm: kmeans
validation:
  supervised_labels: [soil, chickpea, weed]
  external_class: tall_grass
  bootstrap_repeats: 1000
output_dir: results/ssl_baseline

